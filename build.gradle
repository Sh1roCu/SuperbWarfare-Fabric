plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/superbwarfare.accesswidener")
    mixin {
        defaultRefmapName = "superbwarfare.refmap.json"
    }
    runs {
        datagen {
            client()

            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=superbwarfare"
            property "porting_lib.datagen.existing_resources", file("src/main/resources").absolutePath
            runDir "build/datagen"
        }
    }
}

repositories {
    flatDir {
        dir "libs"
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "devOSReleases"
        url = uri("https://mvn.devos.one/releases")
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    modCompileOnly "dev.emi:trinkets:3.7.1"
    modRuntimeOnly "dev.emi:trinkets:3.7.1"

    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.20.1:4.4.6'
    modImplementation("com.eliotlash.mclib:mclib:20")

    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:items:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:obj_loader:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:models:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:model_builders:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:model_generators:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:attributes:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:base:2.3.9+1.20.1"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:chunk_loading:2.3.9+1.20.1"))

    // MKB
    modImplementation(include("maven.modrinth:modernkeybinding:1.20.X-1.2.0"))

    // 可选mod依赖

    // JEI相关
    // compile against the JEI API but do not include it at runtime
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for Fabric
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    // 帕秋莉手册
    modImplementation "vazkii.patchouli:Patchouli:1.20.1-84-FABRIC"

    // Cloth Config相关
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    // Jade相关
    modImplementation "maven.modrinth:jade:${jade_version}"

    // 冷汗
    // modImplementation "curse.maven:cold-sweat-xxx:xxx"

    // 测试用mod
    // 这俩是仅客户端mod
    // modImplementation "curse.maven:irisshaders-455508:6258195")
    // modImplementation "curse.maven:embeddium-908741:5522040")

    modImplementation "curse.maven:tacz-refabricated-1334246:6959045"
    implementation(minecraftLibraries('org.apache.commons:commons-math3:3.6.1'))
    implementation('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation('org.apache.bcel:bcel:6.6.1') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // modImplementation "curse.maven:create-fabric-624165:5982726"
    modImplementation "curse.maven:mmmmmmmmmmmm-225738:6826546"
    modImplementation "curse.maven:selene-499980:6902843"
    // better combat相关
    modImplementation "curse.maven:better-combat-by-daedelus-639842:5625715"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2-rc1+1.20"

    // CCA
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    // Forge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.2"

    // ModMenu
    modImplementation("com.terraformersmc:modmenu:7.2.2")

    include modApi('teamreborn:energy:3.0.0') {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
